name: 夹子机器人模拟交易
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mev-searcher.yml"
      - ".github/heartbeat/mev.txt"
      - "夹子/chains/**"
      - "夹子/config/**"
      - "夹子/engine/**"
      - "夹子/内部测试/**"
      - "夹子/main.py"
      - "夹子/requirements.txt"
  schedule:
    - cron: "27,57 * * * *"
      timezone: "Etc/UTC"

permissions:
  contents: write

concurrency:
  group: mev-searcher-paper-account
  cancel-in-progress: false

jobs:
  simulate:
    name: 夹子机器人
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Resolve main after the concurrency lock; PRs retain their test SHA.
          ref: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'main' || github.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r "夹子/requirements.txt"

      - name: 夹子机器人单元测试
        run: cd "夹子" && python -m unittest discover -s "内部测试" -v

      - name: 夹子机器人多链连接检测
        run: cd "夹子" && python main.py --mode health

      - name: 夹子机器人多链机会扫描
        run: cd "夹子" && python main.py --mode all-scan

      - name: 保存夹子模拟账户
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && success()
        run: |
          if git diff --quiet -- "夹子/mev_account.json"; then
            echo "夹子模拟账户无变化"
            exit 0
          fi

          git config user.name "MEV Searcher Paper Bot"
          git config user.email "actions@github.com"

          git add "夹子/mev_account.json"
          git commit -m "更新夹子模拟账户"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "夹子账户保存冲突，第 $attempt 次重试"
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo "夹子账户状态未能可靠推送，任务失败以避免假成功"
          exit 1

      - name: 保存夹子扫描结果
        uses: actions/upload-artifact@v6
        with:
          name: 夹子机器人扫描-${{ github.run_number }}
          path: 夹子/output/*.json
          retention-days: 14
